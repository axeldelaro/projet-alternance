# ─────────────────────────────────────────────────────────
# Smart Monitoring RRG — Configuration
# Windows (dev) : simulation_mode: true
# Raspberry Pi  : simulation_mode: false
# ─────────────────────────────────────────────────────────

simulation_mode: true       # Mettre false sur le Raspberry Pi

# Capteur DHT22
sensor:
  type: "dht22"
  gpio_pin: 4               # GPIO4 = Pin physique 7 du Pi

# Seuils d'alerte
threshold_temp: 25.0        # °C — alerte si dépassé
threshold_humidity_low: 20.0  # % — alerte si en dessous
threshold_humidity_high: 80.0 # % — alerte si au-dessus

# SNMP
snmp_community: "public"
devices:
  - name: "Switch Core"
    ip: "192.168.1.10"
    oid_status: "1.3.6.1.2.1.1.1.0"
  - name: "Routeur principal"
    ip: "192.168.1.1"
    oid_status: "1.3.6.1.2.1.1.1.0"
